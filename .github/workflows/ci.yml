name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  test-matrix:
    needs: lint
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version:
          - '22.23.2' # renovate: datasource=node-version depName=node-lts-22 packageName=node
          - '24.21.0' # renovate: datasource=node-version depName=node-lts-24 packageName=node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  # Aggregator with a stable name so branch rulesets can require a single `test`
  # check regardless of how the matrix dimensions change.
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Verify matrix succeeded
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "test-matrix did not succeed: $MATRIX_RESULT"
            exit 1
          fi

  security:
    # Skip on Renovate runs — Renovate runs its own vulnerability checks
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          # trivy-action v0.36.0 defaults to Trivy v0.70.0, which parses only
          # the FIRST document of pnpm v12's multi-document pnpm-lock.yaml.
          # Document 1 holds packageManagerDependencies (pnpm's own binaries);
          # the real dependency tree lives in document 2. The result was a
          # silent 0-package scan -- green because nothing was inspected, not
          # because nothing was vulnerable. v0.74.0 reads both documents
          # (verified: 93 packages extracted, was 0). Remove this pin once a
          # trivy-action release ships v0.74.0+ as its default.
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
