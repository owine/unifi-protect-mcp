name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job; none of them writes to the repo.
permissions:
  contents: read

# A push to main gets its own group per commit: GitHub keeps only one pending
# run per group, so during a burst of merges a shared group would cancel the
# CI run of a commit, leaving it with no result to check before publishing a
# release from it.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm audit --prod --audit-level=high
      # Dev dependencies build what gets published, so audit them too.
      - run: pnpm audit --audit-level=critical
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  test-matrix:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version:
          # The lowest Node package.json "engines" allows; keep the two in step.
          - '22.19.0'
          - '22.23.4' # renovate: datasource=node-version depName=node-lts-22 packageName=node
          - '24.22.1' # renovate: datasource=node-version depName=node-lts-24 packageName=node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm test

  # Pack the package as npm would publish it, install the tarball into an
  # empty project and check the installed binary over stdio.
  package:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run test:package

  # Aggregator with a stable name so branch rulesets can require a single `test`
  # check regardless of how the matrix dimensions change.
  # Includes security, so Renovate's auto-merge waits for the Trivy scan too.
  test:
    needs: [test-matrix, package, security]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify matrix, package and security succeeded
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ] || [ "$PACKAGE_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "test-matrix: $MATRIX_RESULT, package: $PACKAGE_RESULT, security: $SECURITY_RESULT"
            exit 1
          fi

  security:
    # Runs on Renovate PRs too: they are the ones that automerge.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy skips pnpm dev dependencies by default; they build what is
          # published, so scan them too.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          # trivy-action v0.36.0 defaults to Trivy v0.70.0, which parses only
          # the FIRST document of pnpm v12's multi-document pnpm-lock.yaml.
          # Document 1 holds packageManagerDependencies (pnpm's own binaries);
          # the real dependency tree lives in document 2. The result was a
          # silent 0-package scan -- green because nothing was inspected, not
          # because nothing was vulnerable. v0.74.0 reads both documents
          # (verified: 93 packages extracted, was 0). Remove this pin once a
          # trivy-action release ships v0.74.0+ as its default.
          version: v0.76.1
