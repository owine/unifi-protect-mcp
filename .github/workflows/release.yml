name: Release

# Two triggers, two halves. CI passing on main runs release-please, which
# opens the release PR and, once it is merged, tags the release and publishes
# the GitHub Release. That Release event then builds and publishes the tagged
# commit. Publishing runs under its own event because npm provenance records
# the run's GITHUB_SHA: under workflow_run that is main's head when the event
# fires, which a later push can move past the tagged commit, so the
# attestation would name a commit other than the one built. Under a release
# event it is the tagged commit itself.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

# Nothing by default: release-please acts through the GitHub App token, and
# publish asks for what it needs.
permissions: {}

# One release-please run at a time, and one publish per tag. Separate groups:
# a group holds one pending run and a newer one replaces it, so a shared group
# could drop a queued publish in favour of the next release-please run.
concurrency:
  group: ${{ github.event_name == 'release' && format('publish-{0}', github.ref_name) || 'release-please' }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    # workflow_run's branch filter matches the head branch name, which a fork
    # PR can also call main; release only after a push to this repo's main.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      # Mint a GitHub App installation token so release-please's PRs/tags are
      # authored by the App, not the default GITHUB_TOKEN. PRs created by the
      # default token cannot trigger other workflows (GitHub's anti-recursion
      # guard), which is why CI never ran on prior release PRs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The App token also matters for the GitHub Release this publishes: a
      # release made with the default token would not trigger the publish
      # half of this workflow.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Everything that runs code from the dependency tree happens here, in a job
  # that cannot mint an npm token: install, build, the tests, and the smoke
  # test, whose `npm install` of the tarball resolves the SDK's transitive
  # ranges fresh from the registry. It hands publish one tarball and its hash.
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
      node-version: ${{ steps.pack.outputs.node-version }}
    steps:
      # Build exactly the tagged commit (the release event's GITHUB_SHA), so
      # the npm version matches its tag, changelog and provenance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node from .nvmrc; no dependency cache, since what is built here is
      # what gets published.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      # No lifecycle scripts: the build needs none of them.
      # A Release can also be published by hand; publish only the version its
      # tag names (tags are bare versions, see release-please-config.json).
      - name: Check the tag names this version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP/package")
          {
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d' ' -f1)"
            echo "version=$(node -p 'require("./package.json").version')"
            echo "node-version=$(node --version)"
          } >> "$GITHUB_OUTPUT"
      # Install this exact tarball into an empty project and check the binary
      # over stdio; it is the file publish will upload.
      - run: sh scripts/smoke-package.sh "$RUNNER_TEMP/package/${{ steps.pack.outputs.tarball }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Can mint an npm OIDC token, so it runs no code from the dependency tree:
  # it only checks the tarball's hash and publishes it.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Verify the tarball is the one build tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  package/$TARBALL" | sha256sum --check
      # setup-node writes the .npmrc that points npm at the registry; `npm
      # publish` authenticates through OIDC trusted publishing (id-token:
      # write), so no token secret is involved. Same Node as build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      # A re-run after a partial failure must not fail on, or replace, a
      # version that already reached npm.
      - id: published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@owine/unifi-protect-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@owine/unifi-protect-mcp@$VERSION is already on npm; nothing to publish"
          fi
      # Publish stays on npm: the most battle-tested OIDC provenance flow.
      - if: steps.published.outputs.already != 'true'
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "package/$TARBALL" --provenance --access public --ignore-scripts
