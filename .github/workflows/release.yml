name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Nothing by default: release-please acts through the GitHub App token, and
# publish asks for what it needs.
permissions: {}

jobs:
  release-please:
    permissions:
      contents: read
    # workflow_run's branch filter matches the head branch name, which a fork
    # PR can also call main; release only after a push to this repo's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # The commit the release was tagged at. release-please tags main as it
      # is when the job runs, which need not be the commit this run was
      # triggered for.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Mint a GitHub App installation token so release-please's PRs/tags are
      # authored by the App, not the default GITHUB_TOKEN. PRs created by the
      # default token cannot trigger other workflows (GitHub's anti-recursion
      # guard), which is why CI never ran on prior release PRs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish exactly the tagged commit, so the npm version matches its tag
      # and changelog; the test steps below re-verify it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
          # setup-node below owns Node here: it writes the .npmrc that
          # `npm publish --provenance` needs (registry-url + OIDC) and
          # provides the npm binary. pnpm/setup v3 would otherwise detect
          # .nvmrc and install its own Node, which setup-node then
          # reinstalls and shadows on PATH -- a wasted runtime download and
          # two runtimes competing in a publish job. `false` opts out of
          # version-file detection; with no `runtime` input and no
          # devEngines.runtime in package.json, the action installs none.
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # No dependency cache: a poisoned cache entry would run in a job
          # that can mint an npm publish token.
      # No lifecycle scripts in a job that can mint an npm OIDC token: a
      # compromised allowed build (lefthook) could otherwise publish with valid
      # provenance. The build needs none of them.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      # Install the packed tarball into an empty project and check the binary
      # over stdio, before anything is published.
      - run: sh scripts/smoke-package.sh
      # Publish stays on npm — most battle-tested OIDC provenance + scoped-package flow.
      # pnpm install/build above produces identical dist/, so the published artifact is the same.
      - run: npm publish --provenance --access public
