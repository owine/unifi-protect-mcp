name: Release

# Publishing a GitHub Release builds and publishes the tagged commit.
# release-drafter (release-drafter.yml) keeps a draft Release up to date on
# main, and a maintainer publishes it to release. Publishing runs under the
# release event because npm provenance records the run's GITHUB_SHA, which
# here is the tagged commit itself.
"on":
  release:
    types: [published]

# Nothing by default: each job asks for what it needs.
permissions: {}

# One publish per tag; a second run for the same tag queues behind the first.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Everything that runs code from the dependency tree happens here, in a job
  # that cannot mint an npm token: install, build, the tests, and the smoke
  # test, whose `npm install` of the tarball resolves the SDK's transitive
  # ranges fresh from the registry. It hands publish one tarball and its hash.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
      node-version: ${{ steps.pack.outputs.node-version }}
    steps:
      # Build exactly the tagged commit (the release event's GITHUB_SHA), so
      # the npm package matches its tag, release notes and provenance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node from .nvmrc; no dependency cache, since what is built here is
      # what gets published.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      # A Release can also be published by hand; publish only a bare X.Y.Z
      # tag, the shape .github/release-drafter.yml drafts (no v prefix, no
      # pre-release suffix).
      - name: Check the tag is a release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not a bare X.Y.Z version"
            exit 1
          fi
      # The repo's package.json reads 0.0.0-development. Stamp the tag's
      # version into it before anything is built, so the tarball's
      # package.json, which src/version.ts reads at runtime, carries the
      # release version. pnpm-lock.yaml does not record the root package's
      # version, so the frozen install still passes.
      - name: Set the version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "$TAG" --no-git-tag-version
      # No lifecycle scripts: the build needs none of them.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP/package")
          {
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d' ' -f1)"
            echo "version=$(node -p 'require("./package.json").version')"
            echo "node-version=$(node --version)"
          } >> "$GITHUB_OUTPUT"
      # Install this exact tarball into an empty project and check the binary
      # over stdio; it is the file publish will upload.
      - run: sh scripts/smoke-package.sh "$RUNNER_TEMP/package/${{ steps.pack.outputs.tarball }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Can mint an npm OIDC token, so it runs no code from the dependency tree:
  # it only checks the tarball's hash and publishes it.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Verify the tarball is the one build tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  package/$TARBALL" | sha256sum --check
      # setup-node writes the .npmrc that points npm at the registry; `npm
      # publish` authenticates through OIDC trusted publishing (id-token:
      # write), so no token secret is involved. Same Node as build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      # A re-run after a partial failure must not fail on, or replace, a
      # version that already reached npm.
      - id: published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@owine/unifi-protect-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@owine/unifi-protect-mcp@$VERSION is already on npm; nothing to publish"
          fi
      # Publish stays on npm: the most battle-tested OIDC provenance flow.
      - if: steps.published.outputs.already != 'true'
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        # ./ is load-bearing: npm reads a bare "package/<file>.tgz" as GitHub
        # shorthand (user/repo) and tries to clone github.com/package/….
        run: npm publish "./package/$TARBALL" --provenance --access public --ignore-scripts
