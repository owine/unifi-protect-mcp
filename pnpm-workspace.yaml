allowBuilds:
  lefthook: true

# CI safety: `pnpm install` errors if the lockfile drifts from package.json.
# The release-age soak lives in the shared Renovate preset, NOT here — a
# pnpm-side minimumReleaseAge double-gates against Renovate and blocks
# updates (including 0-day CVE fixes) from landing.
preferFrozenLockfile: true

# Fail the install when a package version's trust evidence (trusted publisher,
# provenance) is weaker than its earlier releases had: the signature of a
# hijacked maintainer token. Lock file maintenance automerges transitive
# versions Renovate cannot soak, so this is the check that covers them.
# trustPolicyIgnoreAfter (minutes) exempts releases over a year old, which
# mostly predate provenance. A known-good release that trips it goes in
# trustPolicyExclude rather than loosening the policy.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustPolicyExclude:
  # Published by hand from the maintainer's account alongside the first
  # release of lefthook-android-arm64; the tarball matches 2.2.1 bar version
  # strings, and the platform binaries kept their provenance.
  - lefthook@2.2.2

# `pnpm add` writes exact versions (caret/tilde ranges already in package.json
# are still fine for a library — this only controls what `pnpm add` writes).
saveExact: true

# `pnpm audit` fails on moderate+ vulnerabilities by default. CI passes
# `--audit-level=high` explicitly, which overrides this.
audit:
  level: moderate
